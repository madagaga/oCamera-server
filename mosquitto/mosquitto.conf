# oCamera broker: MQTT 3.1.1 over TLS only, login / password, role ACL.
# See MQTT_PROTOCOL.md (appendix A). No plain-text listener on purpose.

persistence true
persistence_location /mosquitto/data/

listener 8883
certfile /mosquitto/certs/fullchain.pem
keyfile  /mosquitto/certs/privkey.pem
tls_version tlsv1.2

allow_anonymous false
password_file /mosquitto/config/ocam/passwd
acl_file /mosquitto/config/ocam/acl
use_username_as_clientid true

max_packet_size 32768
max_connections 200
max_queued_messages 50
max_inflight_messages 20

log_dest stdout
